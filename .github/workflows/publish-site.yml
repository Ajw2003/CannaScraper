name: Publish site

# Puts a change to the page (site/) live without scraping anything. It takes
# the data already on gh-pages, lays the new site/ over it, and pushes. The
# scrape itself only runs from scrape-province.yml, hourly or by hand.
#
# Its own concurrency group, deliberately not the scrape's: GitHub keeps one
# pending run per group, so sharing it would let a page edit cancel a queued
# hourly scrape. The cost is a rare race -- if a scrape publishes in the same
# minute, one push overwrites the other. Nothing is lost: the data comes back
# on the next hourly run, and every scrape publish copies site/ from main too.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: write     # push gh-pages
  pages: read         # find the live URL to verify against

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site from current data plus the new page
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "::error::No gh-pages branch yet, so there is no data to publish the page with. Run the Scrape province workflow first."
            exit 1
          fi
          git fetch --depth 1 origin gh-pages
          if ! git ls-tree --name-only FETCH_HEAD data/ | grep -q .; then
            echo "::error::gh-pages has no data/ folder. Run the Scrape province workflow first."
            exit 1
          fi
          git archive FETCH_HEAD data | tar -x -C "$PUB"
          cp -r site/. "$PUB/"
          touch "$PUB/.nojekyll"
          echo "Data kept: $(ls "$PUB/data" | tr '\n' ' ')"
          echo "PUB=$PUB" >> "$GITHUB_ENV"

      # Same single orphan commit as the scrape's publish, so gh-pages never
      # accumulates history.
      - name: Push gh-pages
        run: |
          set -euo pipefail
          cd "$PUB"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish page $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Pushed gh-pages: $(git ls-files | wc -l) files."

      - name: Verify the live page is the new one
        run: |
          set -euo pipefail
          if ! SITE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null); then
            echo "::warning::GitHub Pages is not switched on for this repo, so nothing is served."
            exit 0
          fi
          WANT=$(sha256sum site/index.html | cut -d' ' -f1)
          for attempt in $(seq 1 20); do
            GOT=$(curl -fsSL "${SITE%/}/index.html?nocache=$attempt" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "Live at $SITE with this commit's page."
              echo "Live at $SITE with page from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: live page does not match yet"
            sleep 15
          done
          echo "::error::Pushed, but $SITE is not serving this commit's page after 5 minutes."
          exit 1
