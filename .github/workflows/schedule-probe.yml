name: Schedule probe (temporary)

# Answers one question fast: does GitHub fire scheduled workflows in this repo
# at all? The hourly scrape's schedule never ran (03:23-06:23 UTC on
# 2026-09-28), and waiting a full hour per attempt to find out is slow. This
# runs every 5 minutes (GitHub's minimum) and does nothing but log the time.
# Delete it once a scheduled run has appeared, or once the question is settled.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Scheduled run fired at $(date -u +%H:%M:%S) UTC (event ${{ github.event_name }})"
