name: Heartbeat

# Bumps a timestamp on main once a week -- a backstop against GitHub's
# 60-day "no activity" auto-disable for scheduled workflows on public repos.
# The province workflows already push to `data` nightly, so this is redundant
# under normal operation; it exists purely for the pathological case where
# all five are somehow stuck for an extended stretch. See "Keeping the
# schedule alive indefinitely" in docs/plans/github-pages-per-province.md.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump heartbeat timestamp
        run: |
          mkdir -p data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/.heartbeat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/.heartbeat
          git diff --cached --quiet || git commit -m "chore: heartbeat"
          git push origin main
