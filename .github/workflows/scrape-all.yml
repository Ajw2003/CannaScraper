name: Scrape all provinces

# The one place scraping is started from. Calls scrape-one.yml once per
# province, either all at once (parallel, the default) or one after another
# (sequential). Each province is its own job, so each shows up, fails and can
# be re-run on its own in the Actions tab.
#
# Parallel is the default because every province runs on its own machine
# with its own IP address and rate-limit budget, so running them together is
# no harder on any one route than running them apart, and the small
# provinces finish in ~10 minutes instead of waiting behind Ontario.
#
# There is deliberately no concurrency group here. Overlap is handled per
# province inside scrape-one.yml, so if Ontario is still busy when the next
# hour starts, Saskatchewan still refreshes on time.
#
# There is no `schedule:` trigger here. GitHub's schedule is unreliable (it
# can be delayed under load or silently dropped, and that's what we saw:
# see docs/4-systems/hourly-trigger.md for the evidence). Instead the `next`
# job below dispatches the next run of this workflow itself once this run is
# done, roughly an hour after this one started, and makes sure a watchdog
# loop (scrape-watchdog.yml) is alive to restart the chain if it ever stalls.
# The watchdog's own `schedule:` cron is the only schedule trigger left in
# this system, and it only has to succeed at restarting the watchdog loop
# itself, not the actual hourly work.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run provinces all at once (parallel) or one after another (sequential).
        type: choice
        options: [parallel, sequential]
        default: parallel
      provinces:
        description: Comma-separated list, e.g. "Alberta, Manitoba". Leave empty for all.
        type: string
        default: ''

permissions:
  contents: write     # passed down to scrape-one.yml
  pages: read

env:
  # Every province the site covers. Adding one is adding it here and to the
  # province list in scrape-one.yml's manual-run form.
  ALL_PROVINCES: '["Saskatchewan", "Alberta", "Ontario", "Manitoba", "British Columbia"]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      provinces: ${{ steps.pick.outputs.provinces }}
      max_parallel: ${{ steps.pick.outputs.max_parallel }}
    steps:
      - id: pick
        env:
          # A chained run (started by the previous run or the watchdog)
          # carries no inputs, so both fall back to defaults.
          MODE: ${{ github.event.inputs.mode || 'parallel' }}
          CHOSEN: ${{ github.event.inputs.provinces || '' }}
        run: |
          set -euo pipefail
          if [ -z "$(echo "$CHOSEN" | tr -d ' ,')" ]; then
            PROVINCES="$ALL_PROVINCES"
          else
            # Split on commas, trim, and refuse anything not in the list:
            # a typo would otherwise start a job that fails on an unknown
            # province after spinning up a machine.
            PROVINCES=$(jq -cn --arg s "$CHOSEN" --argjson all "$ALL_PROVINCES" '
              [$s | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(length > 0)] as $want
              | ($want - $all) as $bad
              | if ($bad | length) > 0
                then error("unknown province(s): \($bad | join(", ")); expected one of: \($all | join(", "))")
                else $want end')
          fi
          if [ "$MODE" = "sequential" ]; then MAX=1; else MAX=$(echo "$PROVINCES" | jq length); fi
          echo "provinces=$PROVINCES" >> "$GITHUB_OUTPUT"
          echo "max_parallel=$MAX" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE ($MAX at a time). Provinces: $PROVINCES"
          echo "**$MODE** ($MAX at a time): $PROVINCES" >> "$GITHUB_STEP_SUMMARY"

  province:
    needs: plan
    strategy:
      # One province failing must not stop the others.
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        province: ${{ fromJSON(needs.plan.outputs.provinces) }}
    uses: ./.github/workflows/scrape-one.yml
    with:
      province: ${{ matrix.province }}

  # The product catalogue (data/catalog.json) is shared by every province and
  # does not need scraping to refresh, so it runs on its own schedule
  # alongside the province jobs rather than being tied to any one of them --
  # same as the running app topping up a stale catalogue on startup
  # (server.py:_refresh_stale_catalog), just on a timer instead of a request.
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # push gh-pages
      pages: read          # find the live URL to check the published age
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Refresh only if the published catalogue is missing or old -- a fresh
      # one costs nothing to skip, and skipping it every hour it is already
      # current is what keeps this job cheap.
      - name: Check the published catalogue's age
        id: check
        run: |
          set -euo pipefail
          AGE_H=""
          if SITE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null); then
            AGE_H=$(curl -fsSL "${SITE%/}/data/catalog.json" 2>/dev/null | python -c "import json,sys,datetime as dt; d=json.load(sys.stdin); at=dt.datetime.fromisoformat(d['generated_at']); at=at if at.tzinfo else at.replace(tzinfo=dt.timezone.utc); print((dt.datetime.now(dt.timezone.utc)-at).total_seconds()/3600.0)" 2>/dev/null || true)
          fi
          if [ -z "$AGE_H" ]; then
            echo "No published catalogue found (or it could not be read); refreshing."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif python -c "import sys; sys.exit(0 if float('$AGE_H') >= 24 else 1)"; then
            echo "Published catalogue is ${AGE_H}h old; refreshing."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "Published catalogue is ${AGE_H}h old; still fresh, nothing to do."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh and export the catalogue
        if: steps.check.outputs.stale == 'true'
        run: |
          set -euo pipefail
          python ci/export_catalog.py --out "$RUNNER_TEMP/out" --refresh

      - name: Publish to gh-pages
        if: steps.check.outputs.stale == 'true'
        env:
          PUBLISH_MESSAGE: "Publish catalogue from ${{ github.sha }}"
        run: |
          set -euo pipefail
          ci/publish_gh_pages.sh \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/out"

  # Keeps the hourly chain going: dispatches the next scrape-all run (see the
  # top-of-file comment) and makes sure the watchdog loop is alive. Runs
  # whether the scrape passed or failed, and only on main -- a PR branch's
  # run must not start chaining runs on main.
  next:
    needs: [plan, province, catalog]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - run: ci/scrape_chain_next.sh
